name: Vayasa Android AAB Build

on:
  workflow_dispatch:
    inputs:
      ad_mode:
        description: "Choose AdMob mode"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - production

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Vayasa Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V56 ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname 'Vayasa-Android-PlayStore-AdMob-v56*.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Vayasa V56 ZIP was not found."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "Found V56 ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract V56 Android project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/vayasa-v56
          mkdir -p /tmp/vayasa-v56

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d /tmp/vayasa-v56

          echo "V56 project extracted."

          find /tmp/vayasa-v56 \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

      - name: Copy Android project to workspace
        shell: bash
        run: |
          set -e

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/android-build.yml' \
            /tmp/vayasa-v56/ ./

          echo "Android project copied."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure verified successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"
          echo "SDK path: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory was not found."
            exit 1
          fi

          SDKMANAGER=""

          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in standard locations."
            echo "Searching entire Android SDK..."

            FOUND="$(find "$SDK" \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null \
              | head -n 1)"

            if [ -n "$FOUND" ]; then
              SDKMANAGER="$FOUND"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found."
            echo "Android SDK contents:"
            find "$SDK" \
              -maxdepth 4 \
              -type f \
              | head -200

            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          SDK_BIN="$(dirname "$SDKMANAGER")"
          export PATH="$SDK_BIN:$PATH"

          echo "PATH updated:"
          echo "$SDK_BIN"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "======================================"
          echo "ANDROID SDK READY"
          echo "======================================"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "SDK: $SDK"

          if [ ! -d "$SDK/platforms/android-36" ]; then
            echo "ERROR: Android 36 platform was not installed."
            exit 1
          fi

          if [ ! -d "$SDK/build-tools/36.0.0" ]; then
            echo "ERROR: Build Tools 36.0.0 were not installed."
            exit 1
          fi

          echo "Android 36 platform: OK"
          echo "Build Tools 36.0.0: OK"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Select AdMob mode
        id: admob
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.ad_mode }}"
          else
            MODE="test"
          fi

          echo "Selected AdMob mode: $MODE"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID CONFIGURATION"
          echo "======================================"

          echo "Application ID:"
          grep -n "applicationId" app/build.gradle.kts || true

          echo ""
          echo "SDK configuration:"
          grep -n "compileSdk\|targetSdk" app/build.gradle.kts || true

          echo ""
          echo "Version:"
          grep -n "versionCode\|versionName" app/build.gradle.kts || true

          echo ""
          echo "AdMob configuration:"
          grep -n "ADMOB" app/build.gradle.kts || true

      - name: Build release AAB
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING VAYASA AAB"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            bundleRelease \
            -PadMode="${{ steps.admob.outputs.mode }}"

      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not created."

            echo ""
            echo "Available build files:"
            find app/build \
              -type f \
              | sort \
              | head -200

            exit 1
          fi

          echo "======================================"
          echo "VAYASA AAB CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$AAB"

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: Vayasa-Android-AAB-${{ steps.admob.outputs.mode }}-V56
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
