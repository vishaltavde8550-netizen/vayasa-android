name: Vayasa Android AAB Build

on:
  workflow_dispatch:
    inputs:
      ad_mode:
        description: "Choose AdMob mode"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - production

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Vayasa Android AAB
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Find V56 ZIP
      # --------------------------------------------------
      - name: Find V56 ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname 'Vayasa-Android-PlayStore-AdMob-v56*.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Vayasa V56 ZIP was not found."
            echo ""
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "Found V56 ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 3. Extract V56 project
      # --------------------------------------------------
      - name: Extract V56 Android project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/vayasa-v56
          mkdir -p /tmp/vayasa-v56

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d /tmp/vayasa-v56

          echo "V56 project extracted."

          find /tmp/vayasa-v56 \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

      # --------------------------------------------------
      # 4. Copy Android project
      # --------------------------------------------------
      - name: Copy Android project to workspace
        shell: bash
        run: |
          set -e

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/android-build.yml' \
            /tmp/vayasa-v56/ ./

          echo "Android project copied."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Android project structure verified."

      # --------------------------------------------------
      # 5. Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 6. Android SDK
      #
      # Do NOT install Android SDK again.
      # GitHub Ubuntu 24.04 runner already contains:
      # Android 36
      # Build Tools 36.0.0
      # Platform Tools
      # --------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "======================================"
          echo "ANDROID SDK CHECK"
          echo "======================================"

          echo "SDK path:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          echo ""
          echo "Android 36:"
          ls -ld "$SDK/platforms/android-36"

          echo ""
          echo "Build Tools 36.0.0:"
          ls -ld "$SDK/build-tools/36.0.0"

          echo ""
          echo "Platform Tools:"
          ls -ld "$SDK/platform-tools"

          echo ""
          echo "Android SDK verification successful."

      # --------------------------------------------------
      # 7. Accept Android licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -executable \
            | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager executable was not found."
            echo ""
            echo "Available command-line tools:"
            find "$SDK/cmdline-tools" \
              -maxdepth 5 \
              -type f \
              | head -100
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android licenses processed."

      # --------------------------------------------------
      # 8. Gradle 8.13
      # --------------------------------------------------
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # --------------------------------------------------
      # 9. Select AdMob mode
      # --------------------------------------------------
      - name: Select AdMob mode
        id: admob
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.ad_mode }}"
          else
            MODE="test"
          fi

          echo "AdMob mode: $MODE"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 10. Verify Vayasa Android configuration
      # --------------------------------------------------
      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VAYASA ANDROID CONFIGURATION"
          echo "======================================"

          echo ""
          echo "Application ID:"
          grep -n "applicationId" app/build.gradle.kts || true

          echo ""
          echo "Compile / Target SDK:"
          grep -n "compileSdk\|targetSdk" app/build.gradle.kts || true

          echo ""
          echo "Version:"
          grep -n "versionCode\|versionName" app/build.gradle.kts || true

          echo ""
          echo "AdMob:"
          grep -n "ADMOB" app/build.gradle.kts || true

      # --------------------------------------------------
      # 11. Build AAB
      # --------------------------------------------------
      - name: Build release AAB
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING VAYASA RELEASE AAB"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            bundleRelease \
            -PadMode="${{ steps.admob.outputs.mode }}"

      # --------------------------------------------------
      # 12. Verify AAB
      # --------------------------------------------------
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not created."

            echo ""
            echo "Available build files:"
            find app/build \
              -type f \
              | sort \
              | head -200

            exit 1
          fi

          echo "======================================"
          echo "VAYASA AAB CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$AAB"

      # --------------------------------------------------
      # 13. Upload AAB
      # --------------------------------------------------
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: Vayasa-Android-AAB-${{ steps.admob.outputs.mode }}-V56
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
