name: Vayasa Android AAB Build

on:
  workflow_dispatch:
    inputs:
      ad_mode:
        description: "Choose AdMob mode"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - production

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Vayasa Android AAB
    runs-on: ubuntu-24.04

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Find V56 ZIP
      # ==================================================
      - name: Find V56 ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname 'Vayasa-Android-PlayStore-AdMob-v56*.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Vayasa V56 ZIP was not found."
            echo ""
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "Found V56 ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 3. Extract V56 Android project
      # ==================================================
      - name: Extract V56 Android project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/vayasa-v56
          mkdir -p /tmp/vayasa-v56

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d /tmp/vayasa-v56

          echo "V56 project extracted."

          find /tmp/vayasa-v56 \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100


      # ==================================================
      # 4. Copy Android project
      # ==================================================
      - name: Copy Android project to workspace
        shell: bash
        run: |
          set -e

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/android-build.yml' \
            /tmp/vayasa-v56/ ./

          echo "Android project copied."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Android project structure verified."


      # ==================================================
      # 5. Set up Java 17
      # ==================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==================================================
      # 6. Verify Android SDK
      # ==================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "======================================"
          echo "ANDROID SDK CHECK"
          echo "======================================"

          echo "SDK path:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          if [ ! -d "$SDK/platforms/android-36" ]; then
            echo "ERROR: Android 36 platform not found."
            exit 1
          fi

          if [ ! -d "$SDK/build-tools/36.0.0" ]; then
            echo "ERROR: Build Tools 36.0.0 not found."
            exit 1
          fi

          if [ ! -d "$SDK/platform-tools" ]; then
            echo "ERROR: Platform Tools not found."
            exit 1
          fi

          echo ""
          echo "Android 36: OK"
          echo "Build Tools 36.0.0: OK"
          echo "Platform Tools: OK"

          echo ""
          echo "Android SDK verification successful."


      # ==================================================
      # 7. Accept Android SDK licenses
      # ==================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -executable \
            | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager executable was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android licenses processed."


      # ==================================================
      # 8. Set up Gradle 8.13
      # ==================================================
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      # ==================================================
      # 9. Select AdMob mode
      # ==================================================
      - name: Select AdMob mode
        id: admob
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.ad_mode }}"
          else
            MODE="test"
          fi

          echo "Selected AdMob mode: $MODE"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 10. Apply required Android minimum SDK fix
      #
      # AdMob SDK 25.5.0 requires minSdk 24.
      # V56 originally has minSdk 23.
      # ==================================================
      - name: Fix minimum Android SDK for AdMob
        shell: bash
        run: |
          set -e

          FILE="app/build.gradle.kts"

          echo "Before fix:"
          grep -n "minSdk" "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          old = "minSdk = 23"
          new = "minSdk = 24"

          if old not in text:
              if "minSdk = 24" in text:
                  print("minSdk is already 24.")
              else:
                  raise SystemExit(
                      "ERROR: Expected minSdk = 23 was not found."
                  )
          else:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Changed minSdk from 23 to 24.")
          PY

          echo ""
          echo "After fix:"
          grep -n "minSdk" "$FILE"

          echo ""
          echo "Minimum Android SDK fix completed."


      # ==================================================
      # 11. Verify Android configuration
      # ==================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VAYASA ANDROID CONFIGURATION"
          echo "======================================"

          echo ""
          echo "Application ID:"
          grep -n "applicationId" app/build.gradle.kts

          echo ""
          echo "Minimum SDK:"
          grep -n "minSdk" app/build.gradle.kts

          echo ""
          echo "Compile / Target SDK:"
          grep -n "compileSdk\|targetSdk" app/build.gradle.kts

          echo ""
          echo "Version:"
          grep -n "versionCode\|versionName" app/build.gradle.kts

          echo ""
          echo "AdMob:"
          grep -n "ADMOB" app/build.gradle.kts

          echo ""
          echo "Expected:"
          echo "minSdk = 24"
          echo "compileSdk = 36"
          echo "targetSdk = 36"


      # ==================================================
      # 12. Build release AAB
      # ==================================================
      - name: Build release AAB
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING VAYASA RELEASE AAB"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            bundleRelease \
            -PadMode="${{ steps.admob.outputs.mode }}"


      # ==================================================
      # 13. Verify AAB
      # ==================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not created."

            echo ""
            echo "Available build files:"
            find app/build \
              -type f \
              | sort \
              | head -200

            exit 1
          fi

          echo "======================================"
          echo "VAYASA AAB CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$AAB"


      # ==================================================
      # 14. Upload AAB
      # ==================================================
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: Vayasa-Android-AAB-${{ steps.admob.outputs.mode }}-V56
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
